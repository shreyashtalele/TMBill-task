services:
  mysql:
    image: mysql:8.4
    container_name: tmbill_mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - tmbill_mysql_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  tmbill_mysql_data: